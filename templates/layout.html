{{define "layout"}}<!doctype html>
<html lang="en" data-theme="auto"{{if .Color}} data-color="{{.Color}}"{{end}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Four Depths</title>
<meta name="description" content="A blog that lets you choose how deep you read: one sentence, one paragraph, three paragraphs, one page, three pages.">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>◐</text></svg>">
<script>
  // Set the theme before paint so the page never flashes.
  try {
    var t = localStorage.getItem('theme');
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<header class="site">
  <a class="wordmark" href="/">Four&nbsp;Depths</a>
  <button id="theme" class="theme" type="button" aria-label="Change the theme">
    <span class="dot" aria-hidden="true"></span><span class="theme-name">auto</span>
  </button>
</header>

<main>{{template "main" .}}</main>

<footer class="site">
  <p>{{.Year}}</p>
</footer>
<script src="/static/app.js" defer></script>
</body>
</html>{{end}}
